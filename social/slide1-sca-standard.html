<title>SCA Standard Flow</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Mulish:wght@400;500;600;700&display=swap">
<style>
  :root{ --bg:#FBFAF6; --surface:#FFFFFF; --border:#E7E2D6; --text:#20242B; --text-muted:#6B7280;
    --font-head:'Baloo 2',ui-rounded,system-ui,sans-serif; --font-body:'Mulish',system-ui,sans-serif;
    --c1:#2F6FED; --c2:#8B5CF6; --c3:#0EA5A0; --c4:#64748B; }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);} svg{max-width:100%;height:auto;display:block;}
</style>
<svg viewBox="0 0 1080 1080" role="img" aria-label="How standard SCA works: read the lockfile, scan every dependency including transitive ones, match against CVE databases, and output a list of alerts.">
  <rect x="0" y="0" width="1080" height="1080" fill="var(--bg)"/>
  <text x="80" y="110" font-family="var(--font-head)" font-size="34" font-weight="600" fill="var(--text-muted)">HOW STANDARD SCA WORKS</text>
  <text x="80" y="165" font-family="var(--font-head)" font-size="50" font-weight="800" fill="var(--text)">The process everyone knows</text>

  <!-- Row 1 -->
  <g>
    <rect x="80" y="240" width="920" height="170" rx="20" fill="var(--surface)" stroke="var(--c1)" stroke-width="3"/>
    <circle cx="170" cy="325" r="46" fill="var(--c1)"/>
    <g transform="translate(170,325)" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-13" y="-17" width="26" height="34" rx="3"/>
      <path d="M-13,-17 L-4,-17 L-4,-8 L-13,-8 Z" fill="white" stroke="none"/>
      <path d="M-7,0 L7,0 M-7,7 L7,7"/>
    </g>
    <text x="250" y="308" font-family="var(--font-head)" font-size="32" font-weight="700" fill="var(--text)">1. Read the lockfile</text>
    <text x="250" y="345" font-family="var(--font-body)" font-size="24" fill="var(--text-muted)">package.json, package-lock.json, requirements.txt…</text>
  </g>

  <!-- Row 2 -->
  <g>
    <rect x="80" y="435" width="920" height="170" rx="20" fill="var(--surface)" stroke="var(--c2)" stroke-width="3"/>
    <circle cx="170" cy="520" r="46" fill="var(--c2)"/>
    <g transform="translate(170,520)" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="-5" cy="-5" r="12"/>
      <path d="M4,4 L16,16"/>
    </g>
    <text x="250" y="503" font-family="var(--font-head)" font-size="32" font-weight="700" fill="var(--text)">2. Scan every dependency</text>
    <text x="250" y="540" font-family="var(--font-body)" font-size="24" fill="var(--text-muted)">Even ones you never installed — transitive dependencies</text>
  </g>

  <!-- Row 3 -->
  <g>
    <rect x="80" y="630" width="920" height="170" rx="20" fill="var(--surface)" stroke="var(--c3)" stroke-width="3"/>
    <circle cx="170" cy="715" r="46" fill="var(--c3)"/>
    <g transform="translate(170,715)" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-16,-10 C-16,-15 16,-15 16,-10 L16,10 C16,15 -16,15 -16,10 Z"/>
      <path d="M-16,-10 C-16,-5 16,-5 16,-10" />
      <path d="M-16,0 C-16,5 16,5 16,0" />
    </g>
    <text x="250" y="698" font-family="var(--font-head)" font-size="32" font-weight="700" fill="var(--text)">3. Match against CVE databases</text>
    <text x="250" y="735" font-family="var(--font-body)" font-size="24" fill="var(--text-muted)">NVD, GHSA, OSV…</text>
  </g>

  <!-- Row 4 -->
  <g>
    <rect x="80" y="825" width="920" height="170" rx="20" fill="var(--surface)" stroke="var(--c4)" stroke-width="3"/>
    <circle cx="170" cy="910" r="46" fill="var(--c4)"/>
    <g transform="translate(170,910)" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-10,16 L-10,-16 L14,-16 L14,-6 L-10,-6"/>
      <path d="M14,-16 L14,-6"/>
    </g>
    <text x="250" y="893" font-family="var(--font-head)" font-size="32" font-weight="700" fill="var(--text)">4. Output a list of alerts</text>
    <text x="250" y="930" font-family="var(--font-body)" font-size="24" fill="var(--text-muted)">Severity, CVE id, patched version…</text>
  </g>
</svg>
